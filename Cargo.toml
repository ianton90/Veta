[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/ianton90/Veta"

[workspace.dependencies]
veta-core = { path = "crates/veta-core" }
veta-gui = { path = "crates/veta-gui" }
veta-cli = { path = "crates/veta-cli" }
veta-testkit = { path = "crates/veta-testkit" }

arrow = { version = "60", features = ["chrono-tz"] }
parquet = "60"
iced = { version = "0.14", features = ["advanced"] }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
toml = "1"
serde_json = { version = "1", features = ["preserve_order"] }
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
mimalloc = "0.1"
clap = { version = "4.6", features = ["derive"] }
uds_windows = "1.2"
embed-resource = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
# Smaller downloads; panics still show the message.
strip = true
