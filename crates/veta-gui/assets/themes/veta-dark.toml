# Veta's default dark theme. See veta-light.toml for the format.

name = "Veta Dark"
mode = "dark"

[font]
size = 14

[colors]
background = "#1e1f22"
text = "#e3e5e8"
primary = "#5b9bff"
success = "#4cc38a"
warning = "#e0a640"
danger = "#f06a6a"

surface = "#2a2b2f"
border = "#3b3d42"
grid_header = "#26272b"
grid_stripe = "#232428"
nested_odd = "#232a35"     # lines of open nested cells, levels 1, 3, 5, …
nested_even = "#2a3445"    # levels 2, 4, 6, …
selection = "#5b9bff"
